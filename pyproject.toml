[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "drocat"
version = "4.5.0"
description = "Hemibrain connectome analysis and visualization toolkit with reorganized modular structure"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Hemibrain Analysis Team"}
]
keywords = ["neuroscience", "connectomics", "visualization", "network-analysis", "neuprint", "drosophila"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Dependencies pinned to tested working versions from conda env 'drocat'
dependencies = [
    "numpy==1.26.4",
    "pandas==1.5.3",
    "polars==1.34.0",
    "xarray<2024.4",
    "scipy==1.13.1",
    "pyarrow==17.0.0",
    "plotly==6.4.0",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "opencv-python==4.10.0.84",
    "bokeh==3.6.0",
    "kaleido==0.2.1",
    "selenium>=4.0.0,<5",
    "webdriver-manager>=4.0.0,<5",
    "networkx==3.3",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "tqdm==4.66.5",
    "requests==2.32.3",
    "chardet==5.2.0",
    "Jinja2==3.1.6",
    "pillow==11.0.0",
    "pydantic==2.13.4",
    "PyQt5==5.15.10",
    "neuprint-python==0.4.26",
    "navis==1.5.0",
    "flybrains==0.6.3",
    "zstandard==0.23.0",
    "boto3>=1.26.0,<2",
    "reportlab==5.0.1",
    "python-pptx==1.0.2",
    "pymupdf==1.28.2",
    "img2pdf==0.5.1",
    # NeuronBridge metadata access uses src/neuronbridge_client.py. Keeping it
    # native avoids neuronbridge-python's incompatible Pydantic/Ray/Memray tree.
    # CAVE API dependencies for FlyWire (FAFB) online data fetching
    "caveclient>=8.0.0,<9",
    "cloud-volume>=12.0.0,<13",
    "fast-simplification>=0.1.0,<0.2",
    "trimesh==4.12.2",
    "psutil>=5.9.0,<8",
    "xlsxwriter>=3.1.0,<4",
    "packaging>=21.0",
]

[project.optional-dependencies]
# Web UI for local execution
ui = [
    "nicegui==3.15.0",
    "pydantic==2.13.4",
    "Jinja2==3.1.6",
]

# Visualization sub-project (minimal dependencies for standalone vispath)
vispath = [
    "numpy==1.26.4",
    "pandas==1.5.3",
    "polars==1.34.0",
    "scipy==1.13.1",
    "plotly==6.4.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "PyQt5==5.15.10",
]

dev = [
    "pytest==7.0.0",
    "pytest-cov==3.0.0",
    "tomli>=2.0.0,<3; python_version < '3.11'",
    "jupyter==1.0.0",
    "ipykernel==6.0.0",
    "black==22.0.0",
    "flake8==4.0.0",
]

viz = [
    "k3d==2.17.0",
    "ipywidgets==8.1.5",
    "open3d==0.19.0",
]

gui = [
    "PyQt5==5.15.10",
]

all = [
    "drocat[dev,viz,gui,ui]"
]

[project.urls]
Homepage = "https://github.com/Swida-Alba/Drosophila-cross-dataset-connectome-analysis"
Repository = "https://github.com/Swida-Alba/Drosophila-cross-dataset-connectome-analysis"
Documentation = "https://github.com/Swida-Alba/Drosophila-cross-dataset-connectome-analysis/blob/main/README.md"

[tool.setuptools]
# Package discovery - src layout (v2.1.0 reorganization)
# Core modules are the flat top-level files in src/ (coana.py, statvis.py,
# morphology.py, ...; vispath.py lives in vispath-subproject and ships from
# its own pyproject). py-modules MUST list every top-level src/*.py: a
# module missing here is silently absent from a non-editable install, and
# packaged modules import each other flat (e.g. coana imports
# connection_map unconditionally).
# Executable scripts are in scripts/: FindPath.py, FindDirect.py, etc.
package-dir = {"" = "src"}
py-modules = [
    "BANC_file_converter",
    "FAFB_file_converter",
    "banc_public_data",
    "build_connection_cache",
    "build_connectivity_profile_cache",
    "build_seed_indexes",
    "cave_data_fetcher",
    "coana",
    "connection_map",
    "fafb_bundle",
    "fafb_utils",
    "flylight_downloader",
    "flywire_ids",
    "flywire_mesh_cache",
    "morphology",
    "morphology_comparison",
    "neuron_index_builder",
    "neuron_search",
    "neuronbridge_client",
    "neuronbridge_cache",
    "neuronbridge_coverage",
    "neuronbridge_finder",
    "neuronbridge_output_policy",
    "neuronbridge_query_expansion",
    "roi_screening",
    "roi_sensitive_segmentation",
    "skeleton_provenance",
    "skeleton_simplification",
    "statvis",
    "storage_inventory",
    "synapse_cache",
    "visualization_options",
    "visualize_skeleton",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

# Note: Scripts are in scripts/ directory and use:
#   sys.path.insert(0, str(Path(__file__).parent.parent / 'src'))
# to import from src/ modules

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv", "*.md"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | cache
  | __pycache__
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]
markers = [
    "e2e: live-network end-to-end tests (real servers; run explicitly)",
    "requires_data: needs real dataset tables (local datasets/ files or a pullable NeuPrint token); skips when neither is available",
    "requires_token: needs a configured NeuPrint token (config.json, config_local.json, or the NEUPRINT_APPLICATION_CREDENTIALS/NEUPRINT_TOKEN env var); skips when absent",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "setup.py",
    "*/__pycache__/*",
    "scripts/*",
    "archive/examples/*",
    "dev/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
